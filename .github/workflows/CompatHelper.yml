name: CompatHelper
on:
  schedule:
    - cron: "00 00 * * *"
  workflow_dispatch:
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
        run: julia -e 'using CompatHelper; CompatHelper.main()'
      - name: List DynamicExpressions and DynamicDiff changes in CompatHelper PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --author app/github-actions --limit 1000 --json number,body --jq '.[] | select((.body | test("the `Dynamic(Expressions|Diff)` package from")) and (.body | contains("BEGIN_COMMIT_OVERRIDE") | not)) | .number' |
            while read -r pr; do
              body=$(gh pr view "$pr" --json body --jq .body)
              read -r pkg old new < <(sed -nE 's/.*the `(DynamicExpressions|DynamicDiff)` package from `([^`]*[^0-9.])?([0-9.]+)` to `([^`]*[^0-9.])?([0-9.]+)`.*/\1 \3 \5/p' <<< "$body")
              repo=$([ "$pkg" = DynamicDiff ] && echo MilesCranmer/DynamicDiff.jl || echo astroautomata/DynamicExpressions.jl)
              git clone -q --bare --filter=blob:none "https://github.com/$repo" "$pr"
              tag() { git -C "$pr" tag -l "v$1" "v$1.*" --sort=v:refname | tail -1; }
              changes=$(git -C "$pr" log "refs/tags/$(tag "$old")..refs/tags/$(tag "$new")" --format=%s |
                sed -nE "/^(feat|fix|perf|deps)(\([^)]*\))?!?: /{s|#([0-9]+)|[$pkg.jl PR \1](https://github.com/$repo/pull/\1)|g;p;}")
              gh api -X PATCH "repos/$GH_REPO/pulls/$pr" --silent -f body="$body

          BEGIN_COMMIT_OVERRIDE
          deps: allow $pkg $new (#$pr)

          $changes
          END_COMMIT_OVERRIDE"
            done
