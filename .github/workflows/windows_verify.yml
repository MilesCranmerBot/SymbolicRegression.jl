name: Windows Verify

on:
  push:
    branches:
      - ci/windows-verify
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: "Cache dependencies"
        uses: julia-actions/cache@v3
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
      - name: "Run unit/misc tests"
        env:
          TEST_GROUP: unit/misc
        run: julia --color=yes --project=. --threads=auto --check-bounds=yes -e 'import Pkg; Pkg.test()'
        shell: bash
